name: Tests

on:
  push:
    branches: [main, stage_release]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Install package
        run: pip install -e ".[dev-core]"

      - name: Run core tests
        working-directory: ensemble_launcher/tests
        run: pytest -m core --timeout=120 -v --tb=short -W ignore::pytest.PytestUnraisableExceptionWarning --ignore=test_mcp.py --ignore=test_vllm.py
